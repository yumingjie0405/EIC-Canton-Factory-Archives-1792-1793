# Alembic configuration for the NEW full-schema baseline environment.
#
# Why a second .ini:
#   * backend/alembic.ini + backend/alembic/ hold the legacy chain
#     (1de0638c0c1b -> 2f7c9e1b5a3d). That chain stays frozen: its files, its
#     configuration and its version table are not touched here.
#   * this file drives an independent script_location (backend/alembic_baseline)
#     that will host the complete schema baseline as a separate chain with its
#     own version table (alembic_version_baseline).
#
# The URL below is a placeholder and is never used. backend/alembic_baseline/env.py
# replaces it with the target validated by app.migration_target_guard. Any
# command run without the required authorization fails closed *before* a
# connection is made:
#
#   $env:EIC_MIGRATION_ALLOWED_TARGETS = "127.0.0.1:5432/ocr_platform_baseline_test"
#   $env:EIC_MIGRATIONS_ENABLED = "1"          # write commands only
#
# Usage:  alembic -c alembic_baseline.ini <command>

[alembic]
script_location = %(here)s/alembic_baseline
prepend_sys_path = .
version_path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
# Placeholder only: env.py overwrites this with the validated target URL.
sqlalchemy.url = driver://user:pass@localhost/dbname

# Selecting this section with ``-n alembic_baseline`` resolves to the same
# guarded script_location, so --name cannot be used to escape the target check.
[alembic_baseline]
script_location = %(here)s/alembic_baseline
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url = driver://user:pass@localhost/dbname
